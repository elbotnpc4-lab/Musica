<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Música con Letra</title>
<style>
  :root {
    --bg: #0f0f0f;
    --panel: #1a1a1a;
    --panel-2: #232323;
    --text: #eaeaea;
    --muted: #9a9a9a;
    --accent: #1db954;
    --border: #2c2c2c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .sidebar-header {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .sidebar-header h1 {
    font-size: 1rem;
    flex: 1;
    letter-spacing: 0.5px;
  }
  .add-btn {
    background: var(--accent);
    color: #000;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
  }
  .add-btn:hover { opacity: 0.85; }

  #search {
    margin: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }

  .song-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
    list-style: none;
  }
  .song-list li {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .song-list li:hover { background: var(--panel-2); }
  .song-list li.active {
    background: rgba(29, 185, 84, 0.15);
    color: var(--accent);
    font-weight: 600;
  }
  .song-list li .del {
    background: transparent;
    border: none;
    color: #666;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .song-list li .del:hover { color: #ff5555; background: #2a2a2a; }
  .song-list .empty {
    text-align: center;
    color: var(--muted);
    padding: 20px;
    font-size: 0.85rem;
    cursor: default;
  }

  /* ---------- MAIN ---------- */
  .main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }
  .main-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--panel);
  }
  .main-header h2 {
    font-size: 1.1rem;
    flex: 1;
    min-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .auto-btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.15s;
  }
  .auto-btn:hover { border-color: var(--accent); }
  .auto-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .speed-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #speed {
    width: 120px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  #speedVal { min-width: 34px; text-align: right; color: var(--text); }

  .lyrics-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 40px 8vw;
    scroll-behavior: smooth;
  }
  #lyrics {
    font-size: 1.15rem;
    line-height: 1.9;
    white-space: pre-wrap;
    color: var(--text);
    max-width: 800px;
    margin: 0 auto;
  }
  #lyrics.empty {
    color: var(--muted);
    text-align: center;
    margin-top: 80px;
    font-size: 1rem;
  }

  /* ---------- MODAL ---------- */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin-bottom: 14px; font-size: 1rem; }
  .modal label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  .modal input, .modal textarea {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { min-height: 200px; resize: vertical; }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: flex-end;
  }
  .modal-actions button {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .modal-actions .primary { background: var(--accent); color: #000; }
  .modal-actions .secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .sidebar.show { display: flex; position: absolute; inset: 0; z-index: 50; width: 100%; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🎵 Mi Música</h1>
      <button class="add-btn" id="openAdd" title="Agregar canción">+</button>
    </div>
    <input type="text" id="search" placeholder="Buscar canción...">
    <ul class="song-list" id="songList"></ul>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <h2 id="songTitle">Selecciona una canción</h2>
      <div class="controls">
        <div class="speed-wrap">
          <span>Velocidad</span>
          <input type="range" id="speed" min="1" max="100" value="20">
          <span id="speedVal">20</span>
        </div>
        <button class="auto-btn" id="autoBtn">▶ Auto Scroll</button>
      </div>
    </div>
    <div class="lyrics-wrap" id="lyricsWrap">
      <div id="lyrics" class="empty">Elige una canción del menú para ver la letra.</div>
    </div>
  </main>
</div>

<!-- MODAL AGREGAR -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Agregar canción</h3>
    <label for="inTitle">Nombre de la canción *</label>
    <input type="text" id="inTitle" placeholder="Ej: Propuesta Indecente">
    <label for="inLyrics">Letra</label>
    <textarea id="inLyrics" placeholder="Pega aquí la letra completa..."></textarea>
    <div class="modal-actions">
      <button class="secondary" id="cancelBtn">Cancelar</button>
      <button class="primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'miMusicaApp_v1';
  const RECENT_KEY  = 'miMusicaReciente_v1';

  let songs = [];        // [{ id, name, lyrics }]
  let currentId = null;
  let editingId = null;
  let autoScrollOn = false;
  let scrollRAF = null;

  // ---------- ELEMENTOS ----------
  const $ = (id) => document.getElementById(id);
  const songListEl = $('songList');
  const searchEl = $('search');
  const lyricsEl = $('lyrics');
  const lyricsWrap = $('lyricsWrap');
  const titleEl = $('songTitle');
  const autoBtn = $('autoBtn');
  const speedEl = $('speed');
  const speedVal = $('speedVal');
  const modalBg = $('modalBg');
  const modalTitle = $('modalTitle');
  const inTitle = $('inTitle');
  const inLyrics = $('inLyrics');

  // ---------- STORAGE ----------
  function loadSongs() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      songs = raw ? JSON.parse(raw) : [];
    } catch(e) { songs = []; }
  }
  function saveSongs() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
  }
  function getRecent() {
    try {
      return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    } catch(e) { return []; }
  }
  function pushRecent(id) {
    let recent = getRecent().filter(x => x !== id);
    recent.unshift(id);
    recent = recent.slice(0, 20);
    localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
  }

  // ---------- RENDER LISTA ----------
  function renderList() {
    const q = searchEl.value.trim().toLowerCase();
    let visible = songs.slice();

    // Orden alfabético (sin importar acentos)
    visible.sort((a, b) =>
      a.name.localeCompare(b.name, 'es', { sensitivity: 'base' })
    );

    if (q) {
      visible = visible.filter(s => s.name.toLowerCase().includes(q));
    }

    songListEl.innerHTML = '';

    if (!visible.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = songs.length
        ? 'No se encontraron canciones'
        : 'Aún no hay canciones. Pulsa + para agregar.';
      songListEl.appendChild(li);
      return;
    }

    visible.forEach(song => {
      const li = document.createElement('li');
      li.dataset.id = song.id;
      if (song.id === currentId) li.classList.add('active');

      const name = document.createElement('span');
      name.textContent = song.name;
      name.style.flex = '1';
      name.style.overflow = 'hidden';
      name.style.textOverflow = 'ellipsis';
      name.style.whiteSpace = 'nowrap';

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Eliminar';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm(`¿Eliminar "${song.name}"?`)) {
          songs = songs.filter(s => s.id !== song.id);
          if (currentId === song.id) {
            currentId = null;
            titleEl.textContent = 'Selecciona una canción';
            lyricsEl.textContent = 'Elige una canción del menú para ver la letra.';
            lyricsEl.classList.add('empty');
          }
          saveSongs();
          renderList();
        }
      });

      li.appendChild(name);
      li.appendChild(del);

      li.addEventListener('click', () => selectSong(song.id));
      songListEl.appendChild(li);
    });
  }

  // ---------- SELECCIONAR ----------
  function selectSong(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    currentId = id;
    titleEl.textContent = song.name;
    lyricsEl.classList.remove('empty');
    lyricsEl.textContent = song.lyrics && song.lyrics.trim()
      ? song.lyrics
      : '(Sin letra. Haz clic derecho o agrega la letra desde el botón +)';

    // Reset scroll
    lyricsWrap.scrollTop = 0;

    pushRecent(id);
    renderList();
    stopAuto();
  }

  // ---------- AUTO SCROLL ----------
  function startAuto() {
    if (autoScrollOn) return;
    autoScrollOn = true;
    autoBtn.classList.add('active');
    autoBtn.textContent = '⏸ Detener';

    let last = performance.now();
    const step = (now) => {
      if (!autoScrollOn) return;
      const dt = (now - last) / 1000;
      last = now;

      const speed = Number(speedEl.value); // 1-100
      // velocidad: píxeles por segundo
      const pxPerSec = speed * 0.6;
      lyricsWrap.scrollTop += pxPerSec * dt;

      // Si llega al fondo, se detiene
      if (lyricsWrap.scrollTop + lyricsWrap.clientHeight >= lyricsWrap.scrollHeight - 1) {
        stopAuto();
        return;
      }
      scrollRAF = requestAnimationFrame(step);
    };
    scrollRAF = requestAnimationFrame(step);
  }

  function stopAuto() {
    autoScrollOn = false;
    autoBtn.classList.remove('active');
    autoBtn.textContent = '▶ Auto Scroll';
    if (scrollRAF) cancelAnimationFrame(scrollRAF);
    scrollRAF = null;
  }

  autoBtn.addEventListener('click', () => {
    if (autoScrollOn) stopAuto();
    else {
      if (!currentId) { alert('Primero elige una canción'); return; }
      startAuto();
    }
  });

  speedEl.addEventListener('input', () => {
    speedVal.textContent = speedEl.value;
  });

  // Detener auto si el usuario hace scroll manual
  let userScrolling = false;
  lyricsWrap.addEventListener('wheel', () => {
    if (autoScrollOn) stopAuto();
  }, { passive: true });
  lyricsWrap.addEventListener('touchstart', () => {
    if (autoScrollOn) stopAuto();
  }, { passive: true });

  // ---------- MODAL ----------
  function openModal(song = null) {
    editingId = song ? song.id : null;
    modalTitle.textContent = song ? 'Editar canción' : 'Agregar canción';
    inTitle.value = song ? song.name : '';
    inLyrics.value = song ? song.lyrics : '';
    modalBg.classList.add('show');
    inTitle.focus();
  }
  function closeModal() {
    modalBg.classList.remove('show');
    editingId = null;
    inTitle.value = '';
    inLyrics.value = '';
  }

  $('openAdd').addEventListener('click', () => openModal());
  $('cancelBtn').addEventListener('click', closeModal);
  modalBg.addEventListener('click', (e) => {
    if (e.target === modalBg) closeModal();
  });

  $('saveBtn').addEventListener('click', () => {
    const name = inTitle.value.trim();
    const lyrics = inLyrics.value;
    if (!name) { alert('Ponle un nombre a la canción'); return; }

    if (editingId) {
      const s = songs.find(x => x.id === editingId);
      if (s) { s.name = name; s.lyrics = lyrics; }
    } else {
      songs.push({
        id: 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        name,
        lyrics
      });
    }
    saveSongs();
    renderList();
    closeModal();

    // Si acabamos de agregar, la seleccionamos
    if (!editingId) {
      const last = songs[songs.length - 1];
      if (last) selectSong(last.id);
    }
  });

  // Editar con doble clic en el título
  titleEl.addEventListener('dblclick', () => {
    if (!currentId) return;
    const song = songs.find(s => s.id === currentId);
    if (song) openModal(song);
  });

  // ---------- INIT ----------
  loadSongs();
  renderList();

  // Si había una última canción vista, la abrimos
  const recent = getRecent();
  if (recent.length && songs.find(s => s.id === recent[0])) {
    selectSong(recent[0]);
  }

  // Atajos
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalBg.classList.contains('show')) closeModal();
    // Barra espaciadora para auto scroll (si no estás escribiendo)
    if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT'
        && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      autoBtn.click();
    }
  });
</script>
</body>
</html>
