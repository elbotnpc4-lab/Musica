<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letras</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: #141418;
      --surface-2: #1b1b21;
      --text: #e8e8ea;
      --muted: #9a9aa0;
      --accent: #e11d2e;
      --border: #26262c;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(11, 11, 13, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: 0;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #ffffff;
      transition: opacity 0.15s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .controls {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    select {
      width: 100%;
      max-width: 520px;
      padding: 11px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
    }

    .slider-wrap {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .slider-wrap.active {
      display: flex;
    }

    .slider-wrap label {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 96px;
    }

    .song-title {
      margin: 0 0 20px;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
    }

    .letra {
      font-size: clamp(18px, 4.4vw, 24px);
      line-height: 1.9;
      white-space: pre-wrap;
      color: #f2f2f4;
    }

    .letra p {
      margin: 0 0 1.1em;
    }

    @media (max-width: 640px) {
      header {
        padding: 12px;
      }

      .brand {
        font-size: 15px;
      }

      .btn {
        padding: 9px 12px;
        font-size: 13px;
      }

      main {
        padding: 20px 14px 80px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Letras</div>
    <div class="header-actions">
      <button id="btnAutoScroll" class="btn" type="button">Auto scroll</button>
    </div>
  </header>

  <section class="controls">
    <select id="selectorCancion" aria-label="Seleccionar cancion"></select>
  </section>

  <section id="sliderWrap" class="slider-wrap">
    <label for="sliderVelocidad">Velocidad</label>
    <input id="sliderVelocidad" type="range" min="0.2" max="4" step="0.1" value="1">
  </section>

  <main>
    <h1 id="tituloActual" class="song-title"></h1>
    <div id="letra" class="letra"></div>
  </main>

  <script>
    let canciones = [];
    let autoScrollActivo = false;
    let scrollSpeed = 1;
    let lastTime = 0;
    let acumulador = 0;

    const selector = document.getElementById("selectorCancion");
    const btnAutoScroll = document.getElementById("btnAutoScroll");
    const sliderWrap = document.getElementById("sliderWrap");
    const sliderVelocidad = document.getElementById("sliderVelocidad");
    const tituloActual = document.getElementById("tituloActual");
    const contenedorLetra = document.getElementById("letra");

    async function init() {
      try {
        const respuesta = await fetch("canciones.json");
        canciones = await respuesta.json();

        canciones.forEach((cancion) => {
          const opcion = document.createElement("option");
          opcion.value = cancion.id;
          opcion.textContent = `${cancion.titulo} — ${cancion.artista}`;
          selector.appendChild(opcion);
        });

        if (canciones.length > 0) {
          selector.value = canciones[0].id;
          await cargarLetra();
        }
      } catch (error) {
        console.error("Error al cargar canciones.json", error);
      }
    }

    async function cargarLetra() {
      const id = selector.value;
      const cancion = canciones.find((item) => String(item.id) === String(id));

      if (!cancion) return;

      detenerAutoScroll();

      try {
        const respuesta = await fetch(cancion.archivo);
        const data = await respuesta.json();

        tituloActual.textContent = `${data.titulo} — ${data.artista}`;
        contenedorLetra.innerHTML = "";

        data.letra.forEach((linea) => {
          const p = document.createElement("p");
          p.textContent = linea;
          contenedorLetra.appendChild(p);
        });

        sliderWrap.classList.remove("active");
        btnAutoScroll.textContent = "Auto scroll";
      } catch (error) {
        console.error("Error al cargar la letra", error);
        contenedorLetra.innerHTML = "<p>No se pudo cargar la letra.</p>";
      }
    }

    function toggleAutoScroll() {
      if (autoScrollActivo) {
        detenerAutoScroll();
        return;
      }

      autoScrollActivo = true;
      sliderWrap.classList.add("active");
      btnAutoScroll.textContent = "Detener";
      lastTime = performance.now();
      acumulador = 0;
      requestAnimationFrame(step);
    }

    function step(now) {
      if (!autoScrollActivo) return;

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      acumulador += delta * scrollSpeed * 40;

      if (acumulador >= 1) {
        const pixeles = Math.floor(acumulador);
        window.scrollBy(0, pixeles);
        acumulador -= pixeles;
      }

      requestAnimationFrame(step);
    }

    function detenerAutoScroll() {
      autoScrollActivo = false;
      sliderWrap.classList.remove("active");
      btnAutoScroll.textContent = "Auto scroll";
    }

    selector.addEventListener("change", cargarLetra);
    btnAutoScroll.addEventListener("click", toggleAutoScroll);

    sliderVelocidad.addEventListener("input", (evento) => {
      scrollSpeed = parseFloat(evento.target.value);
    });

    window.addEventListener("load", init);
  </script>

</body>
</html>
