<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letras</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span class="title">Canciones</span>
      <span class="count" id="songCount">0</span>
      <button class="btn-add" id="openAdd" title="Agregar">+</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Buscar...">
    </div>
    <ul class="song-list" id="songList"></ul>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <div class="mobile-bar">
      <button class="toggle" id="menuToggle">Menu</button>
      <span class="cur" id="mobileCur">Sin seleccion</span>
    </div>

    <div class="main-header">
      <div class="song-title muted" id="songTitle">Selecciona una cancion</div>
      <div class="header-actions">
        <button class="auto-btn" id="autoBtn">Auto Scroll</button>
        <div class="speed-frame" id="speedFrame">
          <button class="playpause paused" id="playPauseBtn" title="Reproducir">
            <svg class="ico-play" viewBox="0 0 12 12" width="10" height="10">
              <polygon points="2,1 11,6 2,11" fill="currentColor"/>
            </svg>
            <svg class="ico-pause" viewBox="0 0 12 12" width="10" height="10">
              <rect x="2" y="1" width="3" height="10" fill="currentColor"/>
              <rect x="7" y="1" width="3" height="10" fill="currentColor"/>
            </svg>
          </button>
          <input type="range" id="speed" min="1" max="100" value="25">
          <span id="speedVal">25</span>
        </div>
      </div>
    </div>

    <div class="lyrics-wrap" id="lyricsWrap">
      <div id="lyrics" class="placeholder">Selecciona una cancion para ver la letra.</div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Agregar cancion</h3>
    <label for="inTitle">Nombre</label>
    <input type="text" id="inTitle" placeholder="Nombre de la cancion">
    <label for="inLyrics">Letra</label>
    <textarea id="inLyrics" placeholder="Pega la letra aqui..."></textarea>
    <div class="modal-actions">
      <button class="secondary" id="cancelBtn">Cancelar</button>
      <button class="primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
